---
# On-device e2e: start the Arizona server, then run the Compose UI tests on an
# Android emulator that drives the /native examples over a real WebSocket. The
# app connects to localhost:4040, tunnelled to the host server via `adb reverse`.
#
# The Android client lives in-repo at clients/android, so the server and client
# are checked out together. Adjust OTP/Node versions and API level for your setup.
name: android-e2e

# Gated with `paths-ignore` (a denylist), NOT the `paths` allowlist that gates
# tauri-shell.yml. The Tauri tests assert only the internal consistency of the
# shell's own Rust constants, so its dependency surface really is one directory.
# This job is the opposite: the emulator drives the LIVE server's `/native/*`
# routes over a real WebSocket, and `scripts/start_test_server.sh` builds that
# server from `src/`, `test/support/` (the native fixtures and the route table)
# and the Vite bundle -- so nearly the whole repo is a genuine input. An
# allowlist there fails unsafe (a new dependency directory silently loses
# coverage); a denylist fails safe (an unlisted new directory still triggers).
# So list only what provably cannot affect the run.
#
# `merge_group` is deliberately absent: GitHub does not support path filtering on
# merge-queue events, so keeping it would boot an emulator on every queue entry
# -- including docs-only merges -- and undo this gate at exactly the point where
# most merges land. The PR-level run is the check, as for any path-filtered
# workflow. Re-add it if cross-PR native regressions ever show up in practice.
#
# `branches: "**"` is a deliberate NET COST INCREASE, not a saving -- be clear
# about which way it cuts. A branch filter glob's `*` does not match `/`, so the
# previous `[main]` filter gave a PR stacked on a `feat/...` base ZERO mobile CI.
# Widening closes that hole, but it also means stacked PRs now boot an emulator
# where they previously ran nothing at all, while `paths-ignore` only subtracts
# docs-only runs. Accepted because a native wire-protocol regression caught on
# the stacked PR is far cheaper than one found after several branches have
# merged. Cheaper than the ios-e2e counterpart (ubuntu, not macOS minutes), so
# if one of the two has to be narrowed, narrow that one first.
"on":
  push:
    branches:
      - main
    # Duplicated below rather than shared via a YAML anchor -- GitHub Actions
    # does not expand anchors/aliases in workflow files. Keep the two in sync.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "clients/ios/**"
      - "clients/tauri/**"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "clients/ios/**"
      - "clients/tauri/**"
  workflow_dispatch: {}

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  emulator-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Single source of truth: Java + Gradle come straight from .tool-versions
      # (mise's native format, including the exact Gradle release), the same file
      # setup-beam/setup-node read for OTP/Node. Scoped to java+gradle so erlang
      # stays on setup-beam's fast precompiled OTP (mise builds it from source).
      # mise puts both on PATH (shims) for the build/test steps below.
      - name: Set up Java + Gradle from .tool-versions
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install_args: java gradle
          cache: true

      # mise caches the Gradle/JDK binaries; this caches the downloaded
      # dependencies (~/.gradle/caches), keyed on the build + version-catalog
      # files so it invalidates when they change.
      - name: Cache Gradle dependencies
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.gradle/caches
          key: >-
            gradle-${{ runner.os }}-${{ hashFiles(
              'clients/android/**/*.gradle.kts',
              'clients/android/gradle/libs.versions.toml',
              'clients/android/gradle.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      # The other half of `make test-android`. These are the wire-protocol logic
      # tests (Backoff/Tree/Interleaver) -- pure JVM, no emulator and no server,
      # so run them here rather than inside the emulator step: they fail fast,
      # they are attributed to logic rather than to a flaky device, and they do
      # not burn emulator minutes.
      - name: Run the Android library unit tests
        working-directory: clients/android
        run: gradle :arizona:testDebugUnitTest

      - name: Set up Erlang/OTP + rebar3
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Node.js dependencies
        run: npm ci

      # Cache the compiled deps so the server step's rebar3 compile only rebuilds
      # arizona itself -- a cold full compile plus vite build otherwise races the
      # server-start poll budget below on slow runners.
      - name: Cache rebar3 _build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: _build
          key: android-rebar3-${{ runner.os }}-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            android-rebar3-${{ runner.os }}-

      - name: Start Arizona server (port 4040; the emulator reaches it via adb reverse)
        run: |
          export PORT=4040 ERLANG_EXTRA_ARGS=-noshell
          ./scripts/start_test_server.sh > /tmp/arizona-server.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf http://localhost:4040/ > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server failed to start"; cat /tmp/arizona-server.log; exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run emulator e2e
        # v2.37.0
        uses: reactivecircus/android-emulator-runner@e89f39f1abbbd05b1113a29cf4db69e7540cae5a
        with:
          api-level: 35
          arch: x86_64
          working-directory: clients/android
          # The :sample build's adbReverse task tunnels the emulator's
          # localhost:4040 to the host server before connectedCheck runs the
          # Compose UI tests (the app connects to http://localhost:4040).
          script: gradle :sample:connectedCheck
