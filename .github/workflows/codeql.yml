---
name: CodeQL

"on":
  push:
    branches:
      - main
  # `**`, not `*`: a GitHub branch filter is a glob in which `*` does not match
  # `/`, so `"*"` silently skips every PR whose base is a `feat/...`-style
  # branch -- exactly the stacked-PR flow this repo uses.
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}
  merge_group:
  schedule:
    - cron: "0 6 * * 1"

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{matrix.language}})
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        language:
          - javascript-typescript
          - actions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{matrix.language}}
          build-mode: none
          # Test code builds DOM from constant fixtures and never ships; scanning
          # it reports taint false positives on every change to a fixture.
          config: |
            paths-ignore:
              - "assets/js/**/*.test.js"
              - "e2e/**"

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: "/language:${{matrix.language}}"
