---
# iOS client CI. Two jobs:
#   - logic: the AzWire protocol tests, run on Linux in the official Swift image
#     (no Mac needed) -- fast, free feedback for the bulk of the client.
#   - simulator-e2e: the SwiftUI render + XCUITest e2e, which need macOS. Starts
#     the Arizona server on :4040 and drives the /native examples on an iOS
#     Simulator. The Simulator shares the runner's localhost, so it reaches the
#     server directly -- no tunnel (unlike android-e2e's adb reverse).
#
# The server is the pure-Erlang `roadrunner` adapter, so it builds on macOS with
# OTP alone; the one thing to watch is setup-beam providing the .tool-versions
# OTP on macOS. Xcode is the runner's default; pin it via maxim-lobanov/setup-xcode
# if a specific version is needed.
name: ios-e2e

# Gated with `paths-ignore` (a denylist), NOT the `paths` allowlist that gates
# tauri-shell.yml. The Tauri tests assert only the internal consistency of the
# shell's own Rust constants, so its dependency surface really is one directory.
# The simulator-e2e job below is the opposite: it drives the LIVE server's
# `/native/*` routes, and `scripts/start_test_server.sh` builds that server from
# `src/`, `test/support/` (the native fixtures and the route table) and the Vite
# bundle -- so nearly the whole repo is a genuine input. An allowlist there fails
# unsafe (a new dependency directory silently loses coverage); a denylist fails
# safe (an unlisted new directory still triggers). So list only what provably
# cannot affect the run. The filter is workflow-wide, so the cheap Linux `logic`
# job (which needs only `clients/ios/`) shares it.
#
# `merge_group` is deliberately absent: GitHub does not support path filtering on
# merge-queue events, so keeping it would run a macOS Simulator on every queue
# entry -- including docs-only merges -- and undo this gate at exactly the point
# where most merges land. macOS runner minutes are the most expensive in the
# repo, so this matters more here than anywhere else. The PR-level run is the
# check, as for any path-filtered workflow.
#
# `branches: "**"` is a deliberate NET COST INCREASE, not a saving -- be clear
# about which way it cuts. A branch filter glob's `*` does not match `/`, so the
# previous `[main]` filter gave a PR stacked on a `feat/...` base ZERO mobile CI.
# Widening closes that hole, but it also means stacked PRs now boot a macOS
# Simulator where they previously ran nothing at all, while `paths-ignore` only
# subtracts docs-only runs. For a repo that stacks PRs the way this one does,
# expect macOS minutes to go UP on net. Accepted because a native wire-protocol
# regression caught on the stacked PR is far cheaper than one found after several
# branches have merged, and because a client change on a feature branch otherwise
# goes untested until that branch retargets main. Narrow it (e.g. back to
# `[main]`, or add a job-level `if` on the base ref) if the minutes prove not
# worth it; `workflow_dispatch` stays available either way.
"on":
  push:
    branches:
      - main
    # Duplicated below rather than shared via a YAML anchor -- GitHub Actions
    # does not expand anchors/aliases in workflow files. Keep the two in sync.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "clients/android/**"
      - "clients/tauri/**"
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - ".claude/**"
      - "clients/android/**"
      - "clients/tauri/**"
  workflow_dispatch: {}

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Run swift test in the official Swift image -- the same way it is verified
      # locally on non-Mac machines. The SwiftUI renderer (AzClientUI) compiles to
      # an empty module here (canImport(SwiftUI) is false) and is exercised by the
      # simulator-e2e job below.
      - name: Run AzWire logic tests
        run: docker run --rm -v "$PWD/clients/ios":/pkg -w /pkg swift:6.1 swift test

  simulator-e2e:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Erlang/OTP + rebar3
        uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24
        with:
          version-type: strict
          version-file: .tool-versions

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install Node.js dependencies
        run: npm ci

      # Cache the compiled deps so the server step only recompiles arizona itself.
      - name: Cache rebar3 _build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: _build
          key: ios-rebar3-${{ runner.os }}-${{ hashFiles('rebar.lock') }}
          restore-keys: |
            ios-rebar3-${{ runner.os }}-

      # The start script runs a cold `vite build` plus a `rebar3 compile` before
      # it binds the port, and a macOS runner is slow enough to sit past a
      # one-minute budget. Same 180s budget as android-e2e's identical step.
      - name: Start Arizona server (port 4040; the Simulator reaches it on localhost)
        run: |
          export PORT=4040 ERLANG_EXTRA_ARGS=-noshell
          ./scripts/start_test_server.sh > /tmp/arizona-server.log 2>&1 &
          for _ in $(seq 1 180); do
            if curl -sf http://localhost:4040/ > /dev/null; then echo "server up"; exit 0; fi
            sleep 1
          done
          echo "server failed to start"; cat /tmp/arizona-server.log; exit 1

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: cd clients/ios/Sample && xcodegen generate

      - name: Run the iOS Simulator e2e
        run: |
          # Resolve ONE concrete simulator and address it by UDID from here on: a
          # model name can match several installed runtimes, and the device we
          # boot has to be the device xcodebuild runs the tests on.
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '.devices | to_entries[]
                     | select(.key | contains("SimRuntime.iOS"))
                     | .value[] | select(.name | startswith("iPhone")) | .udid' \
            | head -1)
          if [ -z "$UDID" ]; then
            echo "no available iPhone simulator"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $UDID"
          # `simctl boot` only kicks the boot off, so the old fire-and-forget
          # left the first test's app launch racing a half-booted device.
          # `bootstatus -b` boots if needed and blocks until the boot completes.
          xcrun simctl bootstatus "$UDID" -b
          cd clients/ios/Sample
          xcodebuild test \
            -scheme Sample \
            -destination "id=$UDID" \
            -resultBundlePath /tmp/ios-e2e.xcresult

      # A Simulator failure is undiagnosable once the runner is gone: the
      # xcresult carries the failing test's screenshots and the app's console
      # output, and the server log says whether the other end was healthy.
      - name: Upload the failure diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: ios-e2e-diagnostics
          path: |
            /tmp/ios-e2e.xcresult
            /tmp/arizona-server.log
          retention-days: 7
