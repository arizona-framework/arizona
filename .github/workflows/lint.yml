---
name: Lint

"on":
  push:
    branches:
      - main
  # `**`, not `*`: a GitHub branch filter is a glob in which `*` does not match
  # `/`, so `"*"` silently skips every PR whose base is a `feat/...`-style
  # branch -- exactly the stacked-PR flow this repo uses.
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  md-lint:
    name: Markdown Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: make check-md

  yaml-lint:
    name: YAML Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: make check-yaml

  action-lint:
    name: Action Lint
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install actionlint
        run: |
          version=1.7.11
          url=https://github.com/rhysd/actionlint/releases/download
          curl -sSL "${url}/v${version}/actionlint_${version}_linux_amd64.tar.gz" \
            | sudo tar xzf - -C /usr/local/bin actionlint
      - run: make check-actions
