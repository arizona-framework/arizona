---
name: Node.js

"on":
  push:
    branches:
      - main
  # `**`, not `*`: a GitHub branch filter is a glob in which `*` does not match
  # `/`, so `"*"` silently skips every PR whose base is a `feat/...`-style
  # branch -- exactly the stacked-PR flow this repo uses.
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Job names are the status-check CONTEXT, so they must be unique across every
  # workflow, not just within this one. `Check` and `Verify artifacts` collided
  # with erlang.yml's jobs of the same name: indistinguishable in the checks UI,
  # and if either workflow were ever path-filtered the shared context could go
  # unreported and leave a PR blocked. Keep the `JS ` qualifier (matching `Unit
  # Test` below) and update the branch ruleset if you rename either.
  check:
    name: JS Check

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Check code
        run: make check-js

  test:
    name: Unit Test

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: make cover-js

  artifacts:
    name: JS Verify artifacts

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - name: Install dependencies
        run: npm ci

      - name: Check if build left artifacts
        run: |
          make build-js
          git diff --exit-code
