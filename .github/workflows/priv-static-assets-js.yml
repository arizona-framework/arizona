---
name: Update priv/static/assets/js

"on":
  push:
    branches:
      - main
  # `**`, not `*`: a GitHub branch filter is a glob in which `*` does not match
  # `/`, so `"*"` silently skips every PR whose base is a `feat/...`-style
  # branch -- exactly the stacked-PR flow this repo uses.
  pull_request:
    branches:
      - "**"
  workflow_dispatch: {}
  merge_group:

concurrency:
  group: ${{github.workflow}}-${{github.ref}}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  branch:
    outputs:
      head_ref: ${{steps.branch.outputs.head_ref}}

    runs-on: ubuntu-26.04

    steps:
      - id: branch
        run: |
          head_ref=${GITHUB_HEAD_REF}
          echo "head_ref is ${head_ref}"
          echo "head_ref=${head_ref}" > "${GITHUB_OUTPUT}"

  update:
    name: Update priv/static/assets/js

    needs: [branch]

    if: endsWith(needs.branch.outputs.head_ref, 'package.json-deps')

    runs-on: ubuntu-26.04

    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{vars.ARIZONA_BOT_APP_ID}}
          private-key: ${{secrets.ARIZONA_BOT_PRIVATE_KEY}}

      # Commit as the app's own bot user, so the commit links to it and Renovate's
      # gitIgnoredAuthors can recognise it.
      - id: bot-user
        run: echo "id=$(gh api "/users/${APP_SLUG}%5Bbot%5D" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          APP_SLUG: ${{steps.app-token.outputs.app-slug}}
          GH_TOKEN: ${{steps.app-token.outputs.token}}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{steps.app-token.outputs.token}}
          ref: ${{needs.branch.outputs.head_ref}}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .tool-versions
          cache: "npm"
          cache-dependency-path: "package-lock.json"

      - run: |
          npm ci
          make build-js
          if ! git diff --exit-code >/dev/null; then
              # there's stuff to push
              git config user.name "${APP_SLUG}[bot]"
              git config user.email "${BOT_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
              git add priv/static/assets/js/*
              git commit -m "[automation] update \`priv/static/assets/js\` after Renovate"
              git push
          fi
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
          APP_SLUG: ${{steps.app-token.outputs.app-slug}}
          BOT_ID: ${{steps.bot-user.outputs.id}}
